const joystick=document.querySelector('#joystick'),joyKnob=document.querySelector('#joy-knob');function joyMove(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.3;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}joyX=dx/max;joyY=dy/max;joyKnob.style.transform='translate('+dx+'px,'+dy+'px)'}function joyEnd(){joyX=0;joyY=0;joyKnob.style.transform='translate(0,0)'}joystick.addEventListener('pointerdown',e=>{e.preventDefault();joystick.setPointerCapture(e.pointerId);joyMove(e)});joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))joyMove(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])joystick.addEventListener(ev,joyEnd);function canStand(x,z){const onPier=Math.abs(x)<1.25&&z>=14.7&&z<=21.25;if(Math.hypot(x,z)>17.1&&!onPier)return false;for(const o of colliders){if(o.type==='circle'){if(Math.hypot(x-o.x,z-o.z)<o.r+.38)return false}else{const dx=x-o.x,dz=z-o.z,cs=Math.cos(o.a),sn=Math.sin(o.a),lx=cs*dx-sn*dz,lz=sn*dx+cs*dz;if(Math.abs(lx)<o.hx+.38&&Math.abs(lz)<o.hz+.34)return false}}return true}let last=0,tick=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.04);last=t;tick+=dt;const dx=(pressed.has('d')||pressed.has('arrowright')?1:0)-(pressed.has('a')||pressed.has('arrowleft')?1:0)+joyX,dz=(pressed.has('s')||pressed.has('arrowdown')?1:0)-(pressed.has('w')||pressed.has('arrowup')?1:0)+joyY;if(!inside&&(dx||dz)){const len=Math.hypot(dx,dz),vx=dx/len,vz=dz/len,nx=avatar.position.x+vx*dt*3,nz=avatar.position.z+vz*dt*3;if(canStand(nx,avatar.position.z))avatar.position.x=nx;if(canStand(avatar.position.x,nz))avatar.position.z=nz;avatar.rotation.y=Math.atan2(vx,vz);avatar.position.y=.28+Math.abs(Math.sin(tick*9))*.06}else avatar.position.y=.28+Math.sin(t*.003)*.012;if(Math.floor(tick*4)%4===0)updateNearby();const aimX=inside?active.pos[0]:0,aimZ=inside?active.pos[2]:4;const zoomTa
